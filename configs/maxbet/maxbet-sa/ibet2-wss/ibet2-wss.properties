#App config
book=1
terminal_code=11
data.include_results=true

websocket.inbound_channel.core_pool_size=64
websocket.outbound_channel.core_pool_size=64
message_broker.logging_period_seconds=60


#Redis session config

redis.session.database=7

#websocket config
websocket.endpoint=/ws3/stomp
websocket_transport.message_size_limit_kb=1000
websocket_transport.send_buffer_size_limit_kb=3072
websocket_transport.send_time_limit_ms=20000

#Rabbit mq
broker.exchange.user=IBET_LIVE_USER
broker.exchange.all=IBET_LIVE_ALL
broker.exchange.languages=IBET_LIVE_LANGUAGES
broker.exchange.official_results=IBET_OFFICIAL_RESULTS
broker.exchange.es_results=IBET_ES_RESULTS
broker.exchange.co_parameter.root=IBET_CO_PARAMETER_ROOT
broker.exchange.co_parameter.group=IBET_CO_PARAMETER_GROUP
broker.exchange.co_parameter.location=IBET_CO_PARAMETER_LOCATION
broker.exchange.co_parameter.terminal=IBET_CO_PARAMETER_TERMINAL
broker.exchange.co_parameter.iuser=IBET_CO_PARAMETER_IUSER
broker.exchangePrefix=IBET_LIVE_USER_

rabbit.vhost=/

rabbit.channel_cache_size=25

# ===== Tomcat config  ============
server.compression.enabled=true

# Whether to enable a livereload.com-compatible server.
spring.devtools.livereload.enabled=false

# ==== Spring boot admin and security config ======
spring.application.name=ibet2-wss

spring.boot.admin.client.period=10000
spring.boot.admin.client.enabled=false
management.security.enabled=true

# Za debug tomcata
#logging.level.org.apache.tomcat=DEBUG
#logging.level.org.apache.catalina=DEBUG

server.tomcat.baseDir=
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%{X-Forwarded-For}i [%{yyyy-MM-dd HH:mm:ss Z}t] %H %m %U %s %q %b %D %{UUID-Client}i %{UUID-my-boot-app}o
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.file-date-format=yyyy-MM-dd
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log

server.tomcat.max-threads=400

#server.connection-timeout=5s
#server.max-http-header-size=8KB
#server.tomcat.max-swallow-size=2MB
#server.tomcat.max-http-post-size=2MB
#server.tomcat.accept-count=100
#server.tomcat.max-connections=10000
#server.tomcat.min-spare-threads=10
#server.tomcat.max-swallow-size=2MB

#server.ssl.enabled=true
