kafka:
  client-id:
    group-notification-stream-sa
  tolerableLagInSeconds: 3  
  num:
    stream: 
      threads: 8
  session-timeout-ms: 20000
  heartbeat-interval-ms: 6000

cassandra:
  cluster_name: MAXBG

rabbit:
  jackpot:
    messageTtl: 300000
  result_change:
    messageTtl: 300000
  platform_event:
    messageTtl: 300000

# Format of fcm match result message
# Wildcards: %h -> home, %a -> away, %p -> phase, %wp -> wrapped phase in parentheses, %m -> matchCode, %sh -> homeScore, %sa -> awayScore, %t -> the team who scored

format:
  match_result:
    scored_point:
      wrapper: "[%s]"
    title: Results
    body:
      finished: "%m %h - %a %sh:%sa (End)"
      pause: "%m %h - %a %sh:%sa %wp"
      result: "%m %h - %a %sh:%sa"

spring:
  application:
    name: group-notification-stream

kafka-admin:
    enabled: true
    topics:
        - name: GROUP_NOTIFICATIONS
          numOfPartitions: 4
          replicationFactor: 2
          retentionMs: 7200000

ehcache:
    od_match:
        ttl:
            seconds: 120
    od_league_sport:
        ttl:
            seconds: 6000

firebase:
  v1Api:
    enabled: true
