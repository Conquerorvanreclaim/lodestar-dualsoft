kafka:
  client-id:
    iuser-event-notification-stream-sa
  tolerableLagInSeconds: 3
  num:
    stream:
      threads: 8
  session-timeout-ms: 20000
  heartbeat-interval-ms: 6000

kafka-admin:
    enabled: true
    topics:
        - name: IUSER_NOTIFICATIONS
          numOfPartitions: 16
          replicationFactor: 2
          retentionMs: 259200000


terminateIcUserSessionsOnSelfExclude: true

