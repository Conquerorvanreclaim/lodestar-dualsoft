book=8
location_code=1002
in_hours_list=1,3
translation_instance_code=oktagon

user.notification.history.limit=15

task_executor.core_pool_size=2
task_executor.max_pool_size=4
offer.scheduling.job.cron=0 * * * * *
bet_definitions.scheduling.job.cron=*/30 * * * * *
#offer.scheduling.job.cron=0 0 * ? * *

#============ ELASTIC ======================
index.mapping.total_fields.limit=5000
index.max_docvalue_fields_search=100
match_search_result_size=1500

elasticsearch.protocol=http

#============ REDIS =========================
redis.database_number=4
# ===== Tomcat config  ============
server.compression.enabled=true
server.servlet.context-path=/restapi

# ==== Spring boot admin config ======
spring.application.name=ibet2-restapi

server.tomcat.baseDir=
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%{X-Forwarded-For}i [%{yyyy-MM-dd HH:mm:ss Z}t] %H %m %U %s %q %b %D %{UUID-Client}i %{UUID-my-boot-app}o
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.file-date-format=yyyy-MM-dd
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.max-threads=400

spring.main.allow-bean-definition-overriding=true


