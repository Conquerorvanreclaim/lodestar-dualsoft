#App config
book=8

data.compress.enabled=false
data.virtual_mode.enabled=false
message.init.match_count=10
message.init_part.match_count=15
live.init-pool.core=200
live.init-pool.max=200
live.publisher.delay.ms=250
sse_emitter.timeout.seconds=60
sse_emitter.reconnect_time.milliseconds=300
sse_emitter.ping_interval.seconds=5
messageStream.ttl.minutes=1
ehcache.init-messages.ttl=2
subscriber.uninitialized_ttl.seconds=10


# ===== Tomcat config  ============
server.compression.enabled=false
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,text/event-stream

server.tomcat.baseDir=
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%{X-Forwarded-For}i [%{yyyy-MM-dd HH:mm:ss Z}t] %H %m %U %s %q %b %D %{UUID-Client}i %{UUID-my-boot-app}o
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.file-date-format=yyyy-MM-dd
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log

server.tomcat.max-threads=400


# ==== Spring boot admin config ======
spring.application.name=ibet2-live

spring.boot.admin.client.enabled=false

