kafka:
  client-id:
    iuser-event-notification-stream-okta-oci
  tolerableLagInSeconds: 3
  num:
    stream:
      threads: 8
  session-timeout-ms: 20000
  heartbeat-interval-ms: 6000

kafka-admin:
    enabled: true
    topics:
        - name: IUSER_NOTIFICATIONS
          numOfPartitions: 1
          replicationFactor: 2
          retentionMs: 259200000
          useUnderscore: true

cassandra:
  notification:
    ic:
      ttl:
        seconds: 86400
    qb:
      ttl:
        seconds: 86400 

