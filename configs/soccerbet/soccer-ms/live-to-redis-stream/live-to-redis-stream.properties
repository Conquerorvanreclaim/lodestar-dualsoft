#kafka
kafka.clientId=dualsoft-live-to-redis-soccer-ms
kafka.use_platform=false
# if kafka.use_platform=true, kafka.num.stream.thread=8
kafka.num.stream.thread=8
kafka.poll.ms=100

kafka.store.name=statestore
kafka.store.retention.minutes=61
kafka.store.grace.minutes=60

#redis
redis.addToStream.enabled=true
redis.stream.maxlen.size=10000
redis.addToZSet.enabled=false

#rabbit
rabbit.messageTtl=60000

data.compress.enabled=false
data.virtualLiveMode.enabled=false
aspect.minimum_duration_to_log_milis=30
exchange.delete.job.cron=0 0 5 * * ?
filter.languages=en,sr,sr_ME,sq,ba,ru
filter.excluded_sports=
