kafka.clientId=dualsoft-offer-streams-soccer-ms
kafka.num.stream.threads=80
kafka.commit.interval.ms=1000

filter.books=10
filter.annexes=0
filter.languages=sr,ba,sr_ME,en,ru

offer.match.add_prematch_bet=true
offer.use_bet_pick_as_key=false


logging.level.AOP=DEBUG

kafka-admin.enabled=true
kafka-admin.topics[0].name=MATCH-OFFER-INTERMEDIATE
kafka-admin.topics[0].numOfPartitions=8
kafka-admin.topics[0].replicationFactor=2
kafka-admin.topics[0].retentionMs=1200000
kafka-admin.topics[0].useUnderscore=false

kafka-admin.topics[1].name=MATCH-OFFER
kafka-admin.topics[1].numOfPartitions=8
kafka-admin.topics[1].replicationFactor=2
kafka-admin.topics[1].retentionMs=1200000
kafka-admin.topics[1].useUnderscore=false

server.servlet.context-path=/offer-streams

bonus_matches.flagging.enabled=true
bet_definitions.import.enabled=true
bet_definitions.scheduling.job.cron=0 0/5 * * * *
bet_pages.locations_by_book_token=10:50001,10000,40001#

#spring.main.allow-bean-definition-overriding=true
