kafka.clientId=dualsoft-offer-streams-soccer-uat-ct
kafka.num.stream.threads=20
kafka.commit.interval.ms=1000

filter.books=10
filter.annexes=0
filter.languages=en,sr,ru,ba,sr_ME

offer.match.add_prematch_bet=true
offer.use_bet_pick_as_key=false


logging.level.AOP=DEBUG

kafka-admin.enabled=true
kafka-admin.topics[0].name=MATCH-OFFER-INTERMEDIATE
kafka-admin.topics[0].numOfPartitions=8
kafka-admin.topics[0].replicationFactor=1
kafka-admin.topics[0].retentionMs=1200000
kafka-admin.topics[0].useUnderscore=false

kafka-admin.topics[1].name=MATCH-OFFER
kafka-admin.topics[1].numOfPartitions=8
kafka-admin.topics[1].replicationFactor=1
kafka-admin.topics[1].retentionMs=1200000
kafka-admin.topics[1].useUnderscore=false
