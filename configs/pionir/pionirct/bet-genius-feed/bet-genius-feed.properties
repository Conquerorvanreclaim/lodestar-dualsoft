quarkus.datasource.reactive.name=${quarkus.application.name}
quarkus.datasource.health.enabled=false


quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.initial-size=20


quarkus.shutdown.timeout=10
graceful-shutdown=true
#ako je 0 onda nece da radi update feed-statusa u D i samim tim i lokovanje svih marketa
feedDownAfterNSeconds=60
auto.save.result.to.prematch=false
ignore.input.method=false
#ako je tag prazan dovlaci sve betove kojima je OD_BET.TAG = null u suprotnom se gleda vrednost iz OD_BET.TAG kolone
betTag =
#delay koji sluzi da stavi status u STOPPED (razlika izmedju njiove poruke i trenutnog vremena u milisekundama)
timeToStopMatch = 2000

