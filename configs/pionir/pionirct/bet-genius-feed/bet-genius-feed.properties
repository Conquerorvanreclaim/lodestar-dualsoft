# ---------------------Logger-------------------------------------
#----------DECODED-DATA-----------------------------------------
quarkus.log.handler.file."decodedData".enable=true
quarkus.log.handler.file."decodedData".path=./logs/decoded-data.log
quarkus.log.handler.file."decodedData".format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.handler.file."decodedData".level=INFO
quarkus.log.handler.file."decodedData".rotation.max-file-size=100M
quarkus.log.handler.file."decodedData".rotation.max-backup-index=30
quarkus.log.handler.file."decodedData".rotation.rotate-on-boot=false
quarkus.log.category."DECODED_DATA".use-parent-handlers=false
quarkus.log.category."DECODED_DATA".handlers=decodedData
#----------RESOLVE_MARKETS-----------------------------------------
quarkus.log.handler.file."resolveMarkets".enable=true
quarkus.log.handler.file."resolveMarkets".path=./logs/resolve-markets.log
quarkus.log.handler.file."resolveMarkets".format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.handler.file."resolveMarkets".level=INFO
quarkus.log.handler.file."resolveMarkets".rotation.max-file-size=100M
quarkus.log.handler.file."resolveMarkets".rotation.max-backup-index=30
quarkus.log.handler.file."resolveMarkets".rotation.rotate-on-boot=false
quarkus.log.category."RESOLVE_MARKETS".use-parent-handlers=false
quarkus.log.category."RESOLVE_MARKETS".handlers=resolveMarkets


#------------------Scheduled---------------------------
scheduled.lock_expired_markets=300s
