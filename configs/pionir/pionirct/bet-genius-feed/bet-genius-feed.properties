#----------------------KAFKA--------------------------------------
quarkus.reactive-messaging.kafka.enable-graceful-shutdown-in-dev-and-test-mode=true
kafka.bootstrap.servers=${kafka.bootstrap-servers}
kafka.suffix=pionirct
json.serialize.null-as-null=true

#KAFKA STREAMS ZA IMPERATIVNI NACIN
quarkus.kafka-streams.application-id=${kafka.clientId.prefix}-${quarkus.application.name}-${kafka.suffix}
quarkus.kafka-streams.topics=${kafka.topics.prefix}_BET_GENIUS_FEED_INTERNAL
kafka-streams.num.stream.threads=8

#kafka-topic-admin
kafka-topic-admin.topics=BET_GENIUS_FEED_INTERNAL
kafka-topic-admin.bet_genius_feed_internal.partitions=32
kafka-topic-admin.bet_genius_feed_internal.replication-factor=2

#internal channel - outgoing
mp.messaging.outgoing.internal-out.connector=smallrye-kafka
mp.messaging.outgoing.internal-out.topic=${kafka.topics.prefix}_BET_GENIUS_FEED_INTERNAL
mp.messaging.outgoing.internal-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

