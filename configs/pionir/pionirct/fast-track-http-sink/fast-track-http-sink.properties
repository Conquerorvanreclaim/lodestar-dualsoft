base.currency=din
prod-mode=false
#-------------------------------------------------------------
json.serialize.null-as-null=true

kafka.suffix=local
kafka.num.stream.threads=32
kafka.bootstrap.servers=${kafka.bootstrap-servers}

quarkus.kafka-streams.application-id=${kafka.clientId.prefix}-${quarkus.application.name}-${kafka.suffix}

#kafka-topic-admin
kafka-topic-admin.topics=FAST_TRACK_REAL_TIME_EVENTS
kafka-topic-admin.fast_track_real_time_events.partitions=16
kafka-topic-admin.fast_track_real_time_events.replication-factor=2


#fast-track-sender channel
mp.messaging.outgoing.fast-track-sender.topic=${kafka.topics.prefix}_FAST_TRACK_REAL_TIME_EVENTS
mp.messaging.outgoing.fast-track-sender.connector=smallrye-kafka
mp.messaging.outgoing.fast-track-sender.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.fast-track-sender.bootstrap.servers=kc4-ct.pionir.io:9092,kc5-ct.pionir.io:9092,kc6-ct.pionir.io:9092

# topici na koji se kaci stream
login.attempt.kafka.topic=${kafka.topics.prefix}_CDC_IC_LOGIN_ATTEMPT
deposit.request.kafka.topic=${kafka.topics.prefix}_CDC_IC_DEPOSIT_REQUEST
withdrawal.request.kafka.topic=${kafka.topics.prefix}_CDC_IC_WITHDRAWAL_REQUEST
user.attribute.kafka.topic=${kafka.topics.prefix}_CDC_IC_USER_ATTRIBUTE
user.fcm.kafka.topic=${kafka.topics.prefix}_CDCT_IC_USER_FCM
user.kafka.topic=${kafka.topics.prefix}_CDCT_IC_USER
user.account.transaction.kafka.topic=${kafka.topics.prefix}_CDC_IC_USER_ACCOUNT_TRANSACTION
w3.ticket.kafka.topic=${kafka.topics.prefix}_CDC_W3_TICKET
user.bonus.kafka.topic=${kafka.topics.prefix}_CDCT_IC_USER_BONUS

quarkus.kafka-streams.topics=${login.attempt.kafka.topic},${deposit.request.kafka.topic},${withdrawal.request.kafka.topic},${user.attribute.kafka.topic},${user.fcm.kafka.topic},${user.kafka.topic},${user.bonus.kafka.topic},${user.account.transaction.kafka.topic},${w3.ticket.kafka.topic}

user.fcm.device_type.map.browser=web
user.fcm.device_type.map.default=web

send.phone.number.verified.date=false
