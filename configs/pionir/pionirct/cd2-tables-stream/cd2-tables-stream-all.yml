kafka-admin:
    enabled: true
    default:
        numOfPartitions: 1
        replicationFactor: 2
        useUnderscore: true
        deleteRetentionMs: 3600000
        maxMessageBytes: 50000000
        segmentBytes: 67108864
        compact:
            segmentMs: 60000 
    topics:
        - name: CDCT_OD_MATCH
          numOfPartitions: 16
          cleanupPolicy: delete,compact
          segmentMs: 60000
          retentionMs: 345600000
        - name: CDCT_OD_MATCH_BET
          numOfPartitions: 16
          cleanupPolicy: delete,compact
          segmentMs: 60000
          retentionMs: 345600000
        - name: CDCT_OD_MATCH_ANNEX
          numOfPartitions: 16
          cleanupPolicy: delete,compact
          segmentMs: 60000
          retentionMs: 345600000
        - name: CDC_IC_USER_ACCOUNT_TRANSACTION
          replicationFactor: 2
          numOfPartitions: 16
        - name: CDCT_IC_USER
          replicationFactor: 2
          numOfPartitions: 8
        - name: CDCT_IC_USER_ACCOUNT
          replicationFactor: 2
          numOfPartitions: 16
        - name: CDCT_IC_USER_FCM
          replicationFactor: 2
          numOfPartitions: 4
        - name: CDCT_IC_USER_BONUS
          replicationFactor: 2
          numOfPartitions: 4
        - name: CDC_W3_TICKET
          replicationFactor: 2
          numOfPartitions: 8
        - name: CDC_QB_PREPAYMENT
          replicationFactor: 2
          numOfPartitions: 4
        - name: CDC_QB_TICKET_AUTH
          replicationFactor: 2
          numOfPartitions: 4
        - name: CDC_ES_RESULT
          replicationFactor: 2
          numOfPartitions: 4
        - name: CDCT_OD_FEED
          numOfPartitions: 1
          replicationFactor: 2
          cleanupPolicy: compact
          segmentMs: 60000
        - name: CDCT_IC_TOURNAMENT_ROUND_POS
          numOfPartitions: 1
          replicationFactor: 2
          cleanupPolicy: delete,compact
          segmentMs: 60000
        - name: CDCT_OD_RESULT
          numOfPartitions: 8
          replicationFactor: 2
          cleanupPolicy: delete,compact
          segmentMs: 60000
