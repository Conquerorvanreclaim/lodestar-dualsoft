regularCsvBetTag=CSV
useExportTemplateForJson=
usePrefixesForSport=
basBonusBetTagRule=
#keepManulOddsAfterReturnToOriginalOdds kontrolise da li se nakon odcekiranja rucne kontrole kvota, kvote vracaju odmah na one sa feed-a ili zadrzavaju one koje su bile pod rucnom kontrolom dok ne stigne prva sledeca poruka sa feeda (false - kvote se odmah vracaju na feed-ove)
keepManulOddsAfterReturnToOriginalOdds=false
#u slucaju da je prethodni parametar false, ostavljam mogucnost da klijent zeli samo da zadrzi markete koji su mu bili rucno kontrolisani
keepOnlyManualControlledMarketAfterReturnToOriginalOdds=false
