##---------------------DATABASE-----------------------------------
#BOA
quarkus.datasource.boa.db-kind=oracle
quarkus.datasource.boa.jdbc=true
quarkus.datasource.boa.reactive=false
quarkus.datasource.boa.jdbc.url=jdbc:oracle:thin:@//db-ct-scan.pionir.io:1521/piodb1.pionir.io
quarkus.datasource.boa.jdbc.max-size=10
quarkus.datasource.boa.jdbc.idle-timeout=2
quarkus.datasource.boa.username=pioboa
quarkus.datasource.boa.password=pioboa
##BET
quarkus.datasource.bet.db-kind=oracle
quarkus.datasource.bet.jdbc=true
quarkus.datasource.bet.reactive=false
quarkus.datasource.bet.jdbc.url=jdbc:oracle:thin:@db-ct-scan.pionir.io:1521/piodb1.pionir.io
quarkus.datasource.bet.jdbc.min-size=4
quarkus.datasource.bet.jdbc.max-size=50
quarkus.datasource.bet.jdbc.initial-size=10
quarkus.datasource.bet.jdbc.idle-timeout=2
quarkus.datasource.bet.username=pionir
quarkus.datasource.bet.password=pionir
quarkus.datasource.bet.jdbc.max-lifetime=150
quarkus.datasource.bet.jdbc.idle-removal-interval=50
quarkus.datasource.bet.jdbc.background-validation-interval=10
quarkus.datasource.bet.jdbc.leak-detection-interval=30
quarkus.datasource.bet.jdbc.acquisition-timeout=10

%dev.mp.messaging.connector.smallrye-kafka.group.id=${kafka.clientId.prefix}-${quarkus.application.name}-pera

#KAFKA
mp.messaging.incoming.in-channel.connector=smallrye-kafka
mp.messaging.incoming.in-channel.topic=${kafka.topics.prefix}_LIVE_FEED_MSG
#ovaj sa dev znaci da se koristi u development fazi. moze da bude i sa %test na pocetku i onda se taj koristi u test fazi
#%dev.mp.messaging.incoming.in-channel.topic=${kafka.topics.prefix}_BOA_GAME
%dev.mp.messaging.incoming.in-channel.topic=${kafka.topics.prefix}_LIVE_FEED_MSG
#mp.messaging.incoming.in-channel.value.deserializer=io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
#mp.messaging.incoming.in-channel.value.deserializer=net.dualsoft.bet.util.token.ObjectJsonAdapter<net.dualsoft.bet.feed.LiveFeedMessageDTO>
mp.messaging.incoming.in-channel.value.deserializer=net.dualsoft.boa.bet.genius.processor.kafka.consumer.LiveFeedMessageDTODeserializer
mp.messaging.incoming.in-channel.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

#kafka-topic-admin
kafka-topic-admin.topics=BOA_GAME
kafka-topic-admin.boa_game.partitions=32
kafka-topic-admin.boa_game.replication-factor=2

mp.messaging.outgoing.out-channel.connector=smallrye-kafka
mp.messaging.outgoing.out-channel.topic=${kafka.topics.prefix}_BOA_GAME
%dev.mp.messaging.outgoing.out-channel.topic=${kafka.topics.prefix}_BOA_GAME
mp.messaging.outgoing.out-channel.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
json.serialize.null-as-null=true
#mp.messaging.connector.smallrye-kafka.group.id
kafka.group.id=${kafka.clientId.prefix}-${quarkus.application.name}-${kafka.clientId.suffix}
kafka.client.id=${kafka.clientId.prefix}-${quarkus.application.name}-${quarkus.uuid}-${kafka.clientId.suffix}


kafka.bootstrap.servers=${kafka.bootstrap-servers}
kafka.topics.prefix=${kafka.clientId.prefix}
#kafka.clientId.prefix=${kafka.clientId.prefix} #uzima ga iz application fajla
kafka.thread-numbers=4
kafka.clientId.suffix=local
kafka.client-id.suffix=local
kafka.pollTimeoutMs=200
kafka.tolerableLagInSeconds=3
kafka.maxPollRecords=100
kafka.maxPollInterval=300000

kafka.use-kafka=true
kafka-admin.enabled=true
kafka.use-kafka-for-tables=false
kafka-admin.topics[0].name=BOA_GAME
kafka-admin.topics[0].numOfPartitions=32
kafka-admin.topics[0].replicationFactor=2
kafka-admin.topics[0].useUnderscore=true
kafka-admin.topics[1].name=BOA_LEAGUE
kafka-admin.topics[1].numOfPartitions=16
kafka-admin.topics[1].replicationFactor=2
kafka-admin.topics[1].useUnderscore=true

channel-code=BG
splitBonusMatches = false

# ---------------------Logger-------------------------------------
quarkus.log.level=INFO
quarkus.log.file.enable=true
#root log
quarkus.log.file.path=./logs/application.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.level=TRACE
#rotation
quarkus.log.file.rotation.max-file-size=100M
quarkus.log.file.rotation.max-backup-index=10
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.rotate-on-boot=false
#console
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG
