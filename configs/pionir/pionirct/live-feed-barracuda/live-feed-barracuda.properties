database.client-id=BarracudaImporter
database.program=BarracudaImporter
database.terminal=BarracudaImporterService
database.min-idle=5
database.max-idle=5
database.max-active=25

logging.level.net.dualsoft=DEBUG

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
spring.jpa.show-sql=true

x3.enabled=true

booker=babooker

minToMatchStart=5

keepAliveDelayInSeconds=10

email.from=live-feed-barracuda-pionir-ct@pionir.io

live_feed.poller_fixed_rate=100
live_feed.receive_timeout=1000
live_feed.messages_per_poll=-1
live_feed.thread_pool=10
live_feed.queue_capacity=10
live_feed.aggregator_release_strategy_capacity=1
live_feed.aggregator_group_timeout=100

profil1=
profil2=
profil3=
profil4=
profil5=
profil6=
profil7=
profil8=
profil9=
profil10=


format=JARRAY

source_type=BA

insert_live_events=false

kafka-admin.enabled=true
kafka-admin.topics[0].name=LIVE-ADMIN-SESSIONS
kafka-admin.topics[0].cleanupPolicy=compact
kafka-admin.topics[0].numofPartitions=1
kafka-admin.topics[0].replicationFactor=2
kafka-admin.topics[0].deleteRetentionsMs=3600000
kafka-admin.topics[0].minCleanableDirtyRatio=0.01
kafka-admin.topics[0].segmentMs=60000

#glavni property koji regulise da li ce da se povezuju mecevi 
auto_connect_barracuda_matches=false
book_for_auto_connect=3
#ako je true i ukljuceno automatsko povezivanje meceva kreirace se novi prematch ako ne postoji 
auto_create_prematch=false

auto_save_result_to_prematch=false
ignore_input_method=false
#ako je true umesto SFID-a od_match se trazi pomocu kolone EXEFEED_LIVE_ID ako je SFID null
check_exefeed_live_id_for_auto_connect=false
#oznake su iz enuma SportType
allowed_sports_for_auto_connect = S,B,T,H,V,HB,SN,FB,FS,W,BB,VS,VB,VT,TT,D

node_id=1
use_live_updater=false
#vreme u milisekundama
time_to_stop_match=
#ako je tag prazan dovlaci sve betove kojima je OD_BET.TAG = null u suprotnom se gleda vrednost iz OD_BET.TAG kolone
betTag =
useVirtualSoccerInsteadESoccer=false
useSpecifiers=true
maxFeedDelay=3000
#ovde je token koji ima strukturu stari_sport_type1;novi_sport_type1#stari_sport_type2;novi_sport_type2#...
replaceSports=

matchStalenessTracking.enabled=false
matchStalenessTracking.fixedDelayMs=10000
matchStalenessTracking.defaultTimeoutSeconds=15
