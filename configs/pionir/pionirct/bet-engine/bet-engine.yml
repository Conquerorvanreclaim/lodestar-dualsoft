database:
  client-id: BETENGINE
  program: bet-engine
  terminal: bet-engine
  min-idle: 10
  max-idle: 10
  max-active: 10

redis:
  readBetData: true

# Da li BE radi u modu za verifikaciju ibet tiketa, 
# u slucaju da radi, tada nema konekciju ka bazi i radi in-memory security
ticketVerifyModeEnabled: false

barracuda:
  enableGrayOdds: true
  url: https://services.exefeed.com/services/?service=prices&uid=merkur&pwd=merkur&events=

server:
  compression:
    enabled: true
    exclude-user-agents:
      mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
      min-response-size: 2048

spring:
  security:
    user:
      name: 
      password: 
      roles:

max-x-ticket-code-gen-attempts: 500

rateLimiter:
  enabled: true
  payin:
    windowSizeInSeconds: 2
    limit: 1
  redis:
    connectionPool:
      maxTotal: 20
      maxIdle: 20
      minIdle: 0

#externalLoyaltyVoucher
maxbetLoyaltyVoucher:
  connectTimeout: 20000
  readTimeout: 60000
