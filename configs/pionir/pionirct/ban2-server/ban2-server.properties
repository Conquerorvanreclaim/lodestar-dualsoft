database.client-id=BAN2SERVER
database.program=Ban2 Server
database.terminal=Ban2ServerPionirCT
database.min-idle=2
database.max-idle=4
database.max-active=10

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
spring.jpa.show-sql=true

invalidatingDelay=5000
processingDelay=300
mergingDelay=1000
ticketBatchSize=250
ticketQuerySize=300000
ticketCacheSize=300000
processingThreads=8
reportingThreads=2

merge.enabled=true
process.enabled=true
invalidate.enabled=true

email.from=ban2-server-pionir-ct@pionir.io

x3.enabled=true

kafka.enabled=true
kafka.client-id=Ban2Server

kafka-admin.enabled=true
kafka-admin.topics[0].name=TICKET-PROCESSOR-EVENTS
kafka-admin.topics[0].numofPartitions=32
kafka-admin.topics[0].replicationFactor=2
kafka-admin.topics[0].retentionMs=43200000
kafka-admin.topics[0].compressionType=lz4
kafka-admin.topics[0].useUnderscore=false
