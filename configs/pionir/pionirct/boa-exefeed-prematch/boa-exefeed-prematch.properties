database.url=jdbc:oracle:thin:@//db-ct-scan.pionir.io:1521/piodb1.pionir.io
database.driver-class-name=oracle.jdbc.OracleDriver
database.username=pionir
database.password=pionir
database.client-id=BoaExefeedPrematch
database.program=BoaExefeedPrematch
database.terminal=BoaExefeedPrematch
database.min-idle=2
database.max-idle=4
database.max-active=10

database.alt.url=jdbc:oracle:thin:@//db-ct-scan.pionir.io:1521/piodb1.pionir.io
database.alt.driver-class-name=oracle.jdbc.OracleDriver
database.alt.username=pioboa
database.alt.password=pioboa
database.alt.client-id=BoaExefeedPrematch
database.alt.program=BoaExefeedPrematch
database.alt.terminal=BoaExefeedPrematch
database.alt.min-idle=1
database.alt.max-idle=2
database.alt.max-active=10

logging.level.net.dualsoft=DEBUG

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
spring.jpa.show-sql=true

channel-code=LM
splitBonusMatches = false
pourOddsInSimilarMarkets=false

kafka.bootstrap-servers=kc4-ct.pionir.io:9092,kc5-ct.pionir.io:9092,kc6-ct.pionir.io:9092
kafka.use-kafka=true
kafka.topics.prefix=PIONIR
kafka-admin.enabled=true
kafka.use-kafka-for-tables=false
kafka-admin.topics[0].name=BOA_GAME
kafka-admin.topics[0].numOfPartitions=32
kafka-admin.topics[0].replicationFactor=2
kafka-admin.topics[0].useUnderscore=true
kafka-admin.topics[1].name=
kafka-admin.topics[1].numOfPartitions=16
kafka-admin.topics[1].replicationFactor=2
kafka-admin.topics[1].useUnderscore=true
kafka.override-channel-in-message-key=

useSpecifiers=true
#enum OddsTypeImport#MARKET,TIP_TYPE,BOTH
oddsType=MARKET
splitPlayersInSeparatedMatches=true
betTag=EXEFEED
#Ako je true ili prazno specijali/strelci/dueli idu u sport special_<maticni_sport>, a ako je false idu u matcni sport (ali u drugu ligu)
useSpecialSportsForOutright=true
#soccerbet ne zeli da mu status C vodi utakmicu u Otkazano nego zeli u Odlozeno
usePostponedForCanceled=true
hcpHTInOriginalFormat = true

#exefeed ima stari format kod koga se razlikuju neke stvari (rezultati recimo) i mora da imam fleg kojim kontrolisem kod
newExeFormat=true
clientName=PIONIR
#ovde je token koji ima strukturu stari_sport_type1;novi_sport_type1#stari_sport_type2;novi_sport_type2#...
replaceSports=
