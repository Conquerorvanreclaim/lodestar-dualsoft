#izbor credit device-a: paylink ili manual (ne radi nista, kada pokrecemo na masini koja nema paylink)
credit.device=manual

path.to.chromium.linux=/usr/bin/chromium-browser
path.to.chromium.windows=chrome.exe
#chromium.additional.params.linux=--kiosk --no-first-run --no-sandbox --test-type --enable-logging  --disable-infobars --disable-session-crashed-bubble --incognito --new-window --enable-overlay-scrollbar --user-data-dir=${HOME}/.chromium-browser/session:
#chromium.additional.params.windows=--kiosk --no-first-run --no-sandbox --test-type --disable-infobars --disable-session-crashed-bubble --incognito --new-window --enable-overlay-scrollbar --user-data-dir="%LOCALAPPDATA%\\Google\\Chrome\\User Data\\session

chromium.additional.params.linux=--kiosk --no-first-run --no-sandbox --test-type --enable-logging  --disable-infobars --disable-session-crashed-bubble --incognito --new-window --enable-overlay-scrollbar --enable-features=OverlayScrollbar --user-data-dir=${HOME}/.chromium-browser/session:
chromium.additional.params.windows=--kiosk --no-first-run --no-sandbox --test-type --disable-infobars --disable-session-crashed-bubble --incognito --new-window --enable-overlay-scrollbar --user-data-dir="%LOCALAPPDATA%\\Google\\Chrome\\User Data\\session

kiosk.ws.url=https://app.merkurtip.rs/kiosk-ws/kiosk/
server.session.timeout=5

kiosk.web.prefix.url=http://localhost:8080/kiosk/kiosk.html?kiosk=

jms.printerJobs.ttl=45000

# timeout vrednosti u milisekundama za povezivanje na i citanje sa remote funkcija
httpInvokerConnectionTimeout=5000
httpInvokerReadTimeout=20000

# delay(ms) za ping kioskws-a
localNetworkCheckFixDelay=43200000
localNetworkCheckConnectTimeout=500
brokerNetworkCheckFixDelay=5000

kiosk.enable.accesslog=true

kiosk.web.activity.timeout=3

kiosk.player.name.linux=omxplayer
kiosk.player.name.windows=
kiosk.video.location.linux=$HOME/kiosk/videos/
kiosk.video.location.windows=

server.port=8881

isKioskLite=true

spring.main.web-environment=true
spring.profiles.active=embedded-tomcat,embedded-browser
