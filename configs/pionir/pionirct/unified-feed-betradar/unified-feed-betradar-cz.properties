#betRefresh opcija koja omogucava da se trenutno aktuelna mapa live igara obrise i ponovo napuni stanjem iz baze koje je u tom trenutku aktuelno
#se aktivira sledecom komandom(http get request) na masini gde se vrti live-feed servis: wget http://localhost:8080/betRefresh
#port se podesava za konkretni servis.

kafka-admin.enabled=true
kafka-admin.topics[0].name=LIVE-ADMIN-SESSIONS
kafka-admin.topics[0].cleanupPolicy=compact
kafka-admin.topics[0].numofPartitions=1
