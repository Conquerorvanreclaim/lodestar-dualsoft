#izbor credit device-a: paylink ili manual (ne radi nista, kada pokrecemo na masini koja nema paylink)
credit.device=paylink

kiosk.ws.url=https://app.merkurtip.rs/kiosk-ws/kiosk/
server.session.timeout=5

kiosk.web.prefix.url=http://localhost:8080/kiosk/kiosk.html?kiosk=

jms.printerJobs.ttl=45000

# timeout vrednosti u milisekundama za povezivanje na i citanje sa remote funkcija
httpInvokerConnectionTimeout=5000
httpInvokerReadTimeout=20000

# delay(ms) za ping kioskws-a
localNetworkCheckFixDelay=1000
localNetworkCheckConnectTimeout=500
brokerNetworkCheckFixDelay=10000

kiosk.enable.accesslog=false

kiosk.web.activity.timeout=

kiosk.player.name.linux=
kiosk.player.name.windows=
kiosk.video.location.linux=
kiosk.video.location.windows=

server.port=8080

isKioskLite=false

spring.main.web-environment=true
spring.profiles.active=embedded-tomcat,embedded-browser
