cdc:
 apply:
  table-name-prefix:

database:
 username: pionir
 password: pionir
 type: oracle
 url: jdbc:oracle:thin:@(DESCRIPTION = (ADDRESS = (PROTOCOL = TCP)(HOST = db-sa-scan.pionir.io)(PORT = 1521)) (CONNECT_DATA = (SERVER = DEDICATED) (SERVICE_NAME = piowh1) ) )
 client-id: cd2
 program: CD2 Apply Service wh2
 terminal: cd2OraApply-wh2
 min-idle: 2
 max-idle: 4 
 max-active: 8
 
kafka:
  bootstrap-servers: 109.94.103.117:9092,109.94.103.118:9092,109.94.103.119:9092
  topics.prefix: PIONIR
  clientId.prefix: PIONIR
  clientId:
    suffix: piowh-2
  numOfStreamThreads: 8
  poolMs: 200 #default 100 ms
  pollTimeoutMs: 200
  tolerableLagInSeconds: 3
  maxPollRecords: 200
  maxPollIntervalMs: 14400000
  sessionTimeoutMs: 45000
  heartbeatIntervalMs: 15000
  maxRequestSize: 1048576

  fetchMaxWaitMs: 500 #default 500 ms
  fetchMaxBytes: 67108864 #64*1024*1024, default je 52428800 (50*1024*1024)

  instances:
  - 'NULL'
  - MERKURCZCERT
  - IFSTEST
  - MERKURCZ
  - TESTMERKUR
  - LANDMERKURRS
  - PIORADAR
  - PIOSTAGE 


